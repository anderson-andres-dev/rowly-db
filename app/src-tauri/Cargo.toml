[package]
name = "khipu-desktop"
version.workspace = true
description = "Rowly DB desktop shell (Tauri), built on the Khipu engine"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
khipu-engine.workspace = true
khipu-driver-core.workspace = true
khipu-driver-mysql.workspace = true
khipu-driver-postgres.workspace = true
tokio.workspace = true
keyring = "4.2.0"
tauri-plugin-dialog = "2"
trash = "5"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
url = "2"
tauri-plugin-window-state = "~2.4.1"
