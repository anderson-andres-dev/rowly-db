# Bases de datos de prueba de Rowly DB: MySQL, MariaDB y Postgres con Sakila /
# Pagila (el mismo videoclub en los tres motores) mas rutinas propias en
# rowly_test. Los datos viven en volumenes con nombre: sobreviven a
# `docker compose down`; `down -v` los borra. Ver README.md.
name: rowly-test-dbs

services:
  mysql:
    # Por defecto, la version verificada de la suite local; el CI la cambia por
    # cada version de `verified` en lines.json.
    image: ${ROWLY_MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242}
    container_name: rowly-test-mysql
    restart: "no"
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: rowly
      MYSQL_USER: rowly
      MYSQL_PASSWORD: rowly
    ports: ["127.0.0.1:33306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data:/data:ro
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prowly --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb:
    image: ${ROWLY_MARIADB_IMAGE:-public.ecr.aws/docker/library/mariadb:11.8.9@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15}
    container_name: rowly-test-mariadb
    restart: "no"
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: rowly
      MARIADB_USER: rowly
      MARIADB_PASSWORD: rowly
    ports: ["127.0.0.1:33307:3306"]
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./data:/data:ro
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -prowly --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres:
    image: ${ROWLY_POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722}
    container_name: rowly-test-postgres
    restart: "no"
    environment:
      POSTGRES_USER: rowly
      POSTGRES_PASSWORD: rowly
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./data:/data:ro
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rowly -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  mysql-data:
  mariadb-data:
  postgres-data:
