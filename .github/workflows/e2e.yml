name: E2E

# Recorridos criticos en la app real sobre Linux/WebKitGTK (tauri-driver).
# Windows/WebView2 y macOS/WKWebView siguen siendo humo manual de release:
# tauri-driver no soporta macOS y en Windows necesita msedgedriver.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: E2E (Linux, WebKitGTK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: rowly
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -uroot -prowly"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Tauri, WebKitWebDriver y Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev webkit2gtk-driver xvfb xdotool mysql-client

      - uses: dtolnay/rust-toolchain@1.90

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Compilar la app (debug, sin instaladores)
        working-directory: app
        run: npx tauri build --debug --no-bundle

      - name: Recorridos E2E
        working-directory: app
        env:
          E2E_MYSQL_PORT: "3306"
        # run.mjs arranca un tauri-driver por recorrido, dentro de este display.
        run: xvfb-run --auto-servernum node tests/e2e/run.mjs --app "$GITHUB_WORKSPACE/target/debug/rowly-db"
