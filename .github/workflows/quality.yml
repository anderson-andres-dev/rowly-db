name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  node:
    name: Node (check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: npm run check
        working-directory: app
        run: npm run check

      - name: npm test
        working-directory: app
        run: npm test

      - name: npm run build
        working-directory: app
        run: npm run build

      - name: Inventario de tests al dia
        run: node tools/inventory/tests.mjs --check

      - name: Cobertura de SQL_ENGINE (tests/sql/coverage.json)
        run: node tools/inventory/coverage.mjs

      - name: Solo versiones publicadas de las dependencias (sin forks, git ni parches)
        run: node tools/inventory/dependencies.mjs

      - name: El grafo de arquitectura coincide con el codigo (docs/ARCHITECTURE.md)
        run: node tools/architecture/graph.mjs --check

      - name: Las versiones verificadas son las de la ventana de soporte (SQL_ENGINE §5.2)
        run: node tools/test-dbs/window.mjs
